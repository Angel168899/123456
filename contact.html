
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸福寶貝母嬰用品館｜聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>幸福寶貝母嬰用品館</h1>
  <p>用心呵護每一個寶貝，陪伴寶寶快樂成長</p>
</header>

<nav>
  <a href="index.html">首頁</a>
  <a href="about.html">公司介紹</a>
  <a href="contact.html" class="active">聯絡我們</a>
</nav>

<main class="container">

  <section class="hero">
    <h2>聯絡我們</h2>
    <p>
      如果您對商品或服務有任何問題，
      歡迎填寫以下表單，
      我們收到訊息後會盡快與您聯繫。
    </p>
  </section>

  <br>

  <form
    class="contact-form"
    action="https://formspree.io/f/mqpplglj"
    method="POST"
  >

    <label for="name">姓名 *</label>
    <input
      type="text"
      id="name"
      name="姓名"
      placeholder="請輸入您的姓名"
      required
    >

    <label for="phone">電話 *</label>
    <input
      type="tel"
      id="phone"
      name="電話"
      placeholder="請輸入您的聯絡電話"
      required
    >

    <label for="email">Email *</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="請輸入您的電子郵件"
      required
    >

    <label for="message">聯絡內容 *</label>
    <textarea
      id="message"
      name="聯絡內容"
      placeholder="請輸入您想詢問的內容..."
      required
    ></textarea>

    <input
      type="hidden"
      name="_subject"
      value="幸福寶貝母嬰用品館－客戶聯絡表單"
    >

    <button type="submit" class="pink-button">
      送出表單
    </button>

    <p class="form-note">
      ※ 請確認填寫資料正確，送出後我們將收到您的訊息。
    </p>

  </form>

</main>

<footer>
  © 2026 幸福寶貝母嬰用品館｜用心呵護每一個寶貝
</footer>

</body>
</html>
